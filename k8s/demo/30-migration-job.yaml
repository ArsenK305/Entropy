apiVersion: batch/v1
kind: Job
metadata:
  name: entropy-migrate
  namespace: entropy-demo
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: entropy-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: alembic
          image: entropy/backend:local
          imagePullPolicy: Never
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: ENTROPY_DEMO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: entropy-demo-db
                  key: username
            - name: ENTROPY_DEMO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: entropy-demo-db
                  key: password
            - name: ENTROPY_DATABASE_URL
              value: postgresql+psycopg://$(ENTROPY_DEMO_DB_USER):$(ENTROPY_DEMO_DB_PASSWORD)@postgres:5432/entropy_demo

