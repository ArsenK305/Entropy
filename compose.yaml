services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: entropy_demo
      POSTGRES_USER: entropy_demo
      POSTGRES_PASSWORD: ${ENTROPY_DOCKER_DB_PASSWORD:-entropy-local-demo-only}
    volumes:
      - entropy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entropy_demo -d entropy_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      ENTROPY_DATABASE_URL: postgresql+psycopg://entropy_demo:${ENTROPY_DOCKER_DB_PASSWORD:-entropy-local-demo-only}@postgres:5432/entropy_demo
      ENTROPY_MODE: ${ENTROPY_DOCKER_MODE:-demo}
      ENTROPY_HOST: 0.0.0.0
      ENTROPY_PORT: "8765"
      ENTROPY_LOCAL_FRONTEND_PORT: ${ENTROPY_DOCKER_FRONTEND_PORT:-5174}
      ENTROPY_MINIAPP_PREVIEW: ${ENTROPY_DOCKER_MINIAPP_PREVIEW:-1}
      ENTROPY_TELEGRAM_POLLING: ${ENTROPY_DOCKER_TELEGRAM_POLLING:-0}
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_MINIAPP_URL: ""
      ENTROPY_N8N_WEBHOOK_URL: ""
      ENTROPY_N8N_EVENT_TOKEN: ""
      ENTROPY_RAG_SEARCH_WEBHOOK_URL: ${ENTROPY_DOCKER_RAG_SEARCH_WEBHOOK_URL:-}
      ENTROPY_RAG_WEBHOOK_TOKEN: ${ENTROPY_DOCKER_RAG_WEBHOOK_TOKEN:-}
      OPENAI_API_KEY: ${ENTROPY_DOCKER_OPENAI_API_KEY:-}
      ENTROPY_MODEL: ${ENTROPY_DOCKER_MODEL:-gpt-6.1-sol}
      ENTROPY_MAX_OUTPUT_TOKENS: ${ENTROPY_DOCKER_MAX_OUTPUT_TOKENS:-1200}
      VELTRICS_MAX_OUTPUT_TOKENS: ${ENTROPY_DOCKER_VELTRICS_MAX_OUTPUT_TOKENS:-800}
      PSYCHE_MAX_OUTPUT_TOKENS: ${ENTROPY_DOCKER_PSYCHE_MAX_OUTPUT_TOKENS:-600}
    volumes:
      - type: bind
        source: ./data/entropy_memory.md
        target: /app/data/entropy_memory.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/career_profile.md
        target: /app/data/career_profile.md
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && exec python app.py"]
    ports:
      - "127.0.0.1:${ENTROPY_DOCKER_BACKEND_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      default:
        aliases:
          - entropy-backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ENTROPY_DOCKER_FRONTEND_PORT:-5174}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  entropy-postgres-data:

