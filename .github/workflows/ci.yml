name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflow files
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo:ro"
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          /repo/.github/workflows/ci.yml

  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python dependencies for known advisories
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check high and critical npm advisories
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build application images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - python-tests
      - frontend-build
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Build backend image
        run: docker build --file Dockerfile.backend --tag entropy/backend:ci .

      - name: Build frontend image
        run: docker build --file Dockerfile.frontend --tag entropy/frontend:ci .

      - name: Smoke-test the unprivileged frontend image
        shell: bash
        run: |
          set -euo pipefail
          container=entropy-frontend-smoke
          docker run --detach --rm --name "$container" \
            --add-host entropy-backend:127.0.0.1 \
            --publish 127.0.0.1::8080 \
            entropy/frontend:ci
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          host_port="$(docker port "$container" 8080/tcp | sed 's/.*://')"
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = 101
          docker exec "$container" nginx -t
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:${host_port}/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            printf 'Frontend health check failed after %s attempts.\n' "$attempt" >&2
            exit 1
          fi
          test "$(curl --fail --silent "http://127.0.0.1:${host_port}/healthz")" = ok
          page="$(curl --fail --silent "http://127.0.0.1:${host_port}/miniapp?preview=1")"
          case "$page" in
            *'<html'*) ;;
            *) printf 'Mini App route did not return the SPA document.\n' >&2; exit 1 ;;
          esac

      - name: Smoke-test the isolated Compose application stack
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-name entropy-ci --env-file .env.docker.example)
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              "${compose[@]}" logs --no-color || true
            fi
            "${compose[@]}" down --volumes --remove-orphans
            exit "$status"
          }
          trap cleanup EXIT

          mkdir -p data
          : > data/career_profile.md
          printf 'CI-only continuity memory\n' > data/entropy_memory.md
          "${compose[@]}" up --detach --build --wait --wait-timeout 120
          test "$("${compose[@]}" exec -T backend id -u)" = 10001
          test "$("${compose[@]}" exec -T frontend id -u)" = 101
          private_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'CF-Ray: ci-tunnel-test' http://127.0.0.1:5174/api/state)"
          test "$private_status" = 403
          memory_private_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'CF-Ray: ci-tunnel-test' 'http://127.0.0.1:5174/api/memory?workspace=career')"
          test "$memory_private_status" = 403
          curl --fail --silent --header 'CF-Ray: ci-tunnel-test' http://127.0.0.1:5174/api/miniapp/catalog |
            python3 -c 'import json, sys; assert len(json.load(sys.stdin).get("products", [])) == 3'
          preview_order_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'CF-Ray: ci-tunnel-test' --header 'Origin: http://127.0.0.1:5174' --header 'Content-Type: application/json' --data '{"product_id":"entropy-box","init_data":""}' http://127.0.0.1:8765/api/miniapp/orders)"
          test "$preview_order_status" = 503
          curl --fail --silent http://127.0.0.1:8765/health |
            python3 -c 'import json, sys; assert json.load(sys.stdin).get("status") == "ok"'
          curl --fail --silent http://127.0.0.1:8765/health/live |
            python3 -c 'import json, sys; assert json.load(sys.stdin).get("status") == "ok"'
          curl --fail --silent http://127.0.0.1:5174/api/state |
            python3 -c 'import json, sys; data=json.load(sys.stdin); assert isinstance(data.get("conversations"), list); assert isinstance(data.get("tasks"), list)'
          curl --fail --silent http://127.0.0.1:5174/api/career/applications |
            python3 -c 'import json, sys; data=json.load(sys.stdin); assert isinstance(data.get("applications"), list)'
          curl --fail --silent 'http://127.0.0.1:8765/api/memory?workspace=general' |
            python3 -c 'import json, sys; data=json.load(sys.stdin); sources={item["id"]: item for item in data.get("sources", [])}; required=("project-rules", "project-charter", "mvp-scope", "learning-state", "continuity-memory"); assert all(sources.get(key, {}).get("available") and sources.get(key, {}).get("included") for key in required); profile=sources["career-profile"]; assert profile.get("sensitive") and not profile.get("selected") and not profile.get("included")'
          curl --fail --silent 'http://127.0.0.1:8765/api/memory?workspace=career' |
            python3 -c 'import json, sys; data=json.load(sys.stdin); sources={item["id"]: item for item in data.get("sources", [])}; profile=sources["career-profile"]; assert profile["available"] and profile["selected"] and not profile["included"]'
          curl --fail --silent http://127.0.0.1:5174/api/miniapp/catalog |
            python3 -c 'import json, sys; data=json.load(sys.stdin); assert len(data.get("products", [])) == 3; assert not data.get("telegram_configured")'
          for route in / /argus '/miniapp?preview=1'; do
            curl --fail --silent "http://127.0.0.1:5174$route" |
              python3 -c 'import sys; assert "<html" in sys.stdin.read().lower()'
          done

  kubernetes-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate demo manifests against Kubernetes schemas
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/work:ro"
          ghcr.io/yannh/kubeconform@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f
          -strict -summary -kubernetes-version 1.36.0 /work/k8s/demo

  powershell-scripts:
    name: Windows PowerShell scripts
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse scripts in Windows PowerShell 5.1
        shell: powershell
        run: |
          $scriptFiles = @(Get-ChildItem scripts -Filter '*.ps1' -File)
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptFile.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "$($scriptFile.Name): $($parseErrors[0].Message)"
            }
          }
          Write-Host "Parsed $($scriptFiles.Count) PowerShell scripts."
